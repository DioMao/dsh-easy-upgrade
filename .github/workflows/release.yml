name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '24'
  DSH_HARNESS_REF: cd5ef8148158c3a752a658978873241fdf8e2bbc
  DSH_HARNESS_DIR: ${{ github.workspace }}/.toolchain/deepseek-harness

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the DeepSeek Harness plugin
        uses: bowenliang123/dsh-plugin-checker@v1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check out the pinned DeepSeek Harness toolchain
        uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_HARNESS_REF }}
          path: .toolchain/deepseek-harness
          persist-credentials: false

      - name: Install harness dependencies
        working-directory: .toolchain/deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Lint and test
        run: pnpm run lint && pnpm test

      - name: Build and smoke-test bundle
        run: pnpm run build && pnpm run test:bundle

      - name: Verify npm package contents
        run: pnpm run test:package

      - name: Verify version matches tag
        run: |
          tag="${{ github.ref_name }}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package version $version"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
